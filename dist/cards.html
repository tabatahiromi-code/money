<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>カード利用履歴｜こつこつ 家計簿</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="header-identity"><a class="brand" href="index.html"><span class="logo" aria-hidden="true">❀</span><span>こつこつ<small>家計簿</small></span></a><a class="tool-button" href="settings.html">⚙ 設定</a></div></header><nav class="page-tabs" aria-label="家計簿のページ"><a href="index.html">家計簿</a><a href="cards.html" aria-current="page">カード利用履歴</a></nav><h1>カード利用履歴</h1><p class="help">利用した月の1日〜末日で表示します。家計の締め日には連動せず、収支・予算・支出の内訳の計算にも含めません。実際の支払いは、口座から引き落とされた日の記録を家計簿に登録してください。</p><div class="month"><button id="prev" aria-label="前の利用月">‹</button><label class="card-month-label">利用月<input id="usage-month" type="month" required></label><button id="next" aria-label="次の利用月">›</button><button id="today" class="subtle">今月</button></div><section class="card"><div class="section-title"><h2>利用明細 <span id="count" class="tag">0件</span></h2><a class="tool-button" href="index.html">明細を登録・取り込む</a></div><div id="card-entries" aria-live="polite"></div><p class="help">取り込み済みのCSV・PDF明細が見つからない場合は、<a href="settings.html#card-statements">設定でカードの名前を選択</a>してください。</p></section><p id="cards-error" class="field-error" role="alert" hidden></p><footer><small>記録はこのブラウザに保存されています。</small></footer></main><script type="module" src="cards.mjs?v=20261017-card-history"></script></body></html>
